
name: Build and Push Docker Image

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: observer-backend-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/2026knu-capstone-design-project1/capstone1-be:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          
          printf '%s\n' "$EC2_PRIVATE_KEY" > ~/.ssh/observer-actions
          chmod 600 ~/.ssh/observer-actions
          
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          
          ssh -T \
            -i ~/.ssh/observer-actions \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            ubuntu@"$EC2_HOST" 'bash -se' <<'REMOTE'
          cd /opt/observer
          
          sudo -n docker compose pull backend
          sudo -n docker compose up -d --no-deps backend
          
          for i in $(seq 1 20); do
            if curl -fsS --max-time 3 \
              -X POST http://127.0.0.1:8080/api/auth/check-loginId \
              -H 'Content-Type: application/json' \
              -d '{"loginId":"deploy-healthcheck"}' > /dev/null; then
              echo "Deployment health check passed"
              sudo -n docker compose ps
              exit 0
            fi
            sleep 3
          done
          
          echo "Deployment health check failed"
          sudo -n docker compose logs --tail=80 backend
          exit 1
          REMOTE